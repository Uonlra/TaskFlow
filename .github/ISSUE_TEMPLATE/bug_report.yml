name: Bug Report / Bug 反馈
description: Report a reproducible problem / 反馈可复现的问题
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        感谢你花时间反馈问题。

        Please submit only one issue per report. If you have multiple unrelated problems, open separate issues.
        请每次仅反馈一个问题。如果有多个不相关的问题，请分别提交 issue。

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist / 提交前确认
      options:
        - label: I have searched existing issues and found no duplicate or similar report. / 我已搜索现有 issue，未找到重复或类似问题。
          required: true
        - label: This report describes only one problem. / 本 issue 仅反馈一个问题。
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      description: Select the platform where the problem occurs. / 请选择问题发生的平台。
      multiple: true
      options:
        - Web browser / 浏览器
        - Mobile browser / 移动端浏览器
        - Other / 其他
    validations:
      required: true

  - type: input
    id: browser_device
    attributes:
      label: Browser, OS, and device / 浏览器、系统与设备
      description: Include browser version, OS version, and device model. / 请填写浏览器版本、系统版本和设备型号。
      placeholder: Chrome 140 / Windows 11 24H2 / Desktop or iPhone 15
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version or commit / 应用版本或提交记录
      description: Use the version shown in the app or the commit used for local development. / 请填写应用显示的版本号，或本地运行时使用的 commit。
      placeholder: 1.0.0 or abc1234
    validations:
      required: true

  - type: dropdown
    id: installation_source
    attributes:
      label: Access method / 使用方式
      description: How did you access TaskFlow? / 你通过什么方式访问 TaskFlow？
      options:
        - Online preview / 在线预览
        - Local development / 本地开发
        - Self-hosted deployment / 自行部署
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description / 问题描述
      description: Describe what happened and how often it happens. / 请描述发生了什么，以及问题出现的频率。
      placeholder: |
        What happened?
        发生了什么问题？

        How often does it happen?
        问题出现的频率如何？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Provide the smallest set of steps that reproduces the problem. / 请提供能够复现问题的最少步骤。
      placeholder: |
        1. Open ... / 打开……
        2. Click ... / 点击……
        3. See ... / 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
      description: What did you expect to happen? / 你原本预期会发生什么？
      placeholder: The app should ... / 应该……
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: What actually happened? / 实际发生了什么？
      placeholder: The app actually ... / 实际却……
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings / 日志、截图或录屏
      description: Attach relevant evidence and remove sensitive information first. / 请附上相关证据，并先移除敏感信息。
      placeholder: Drag and drop or paste files here. / 可将文件拖拽或粘贴到这里。

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context / 其他信息
      description: Add any other details that may help diagnose the issue. / 补充任何有助于定位问题的信息。
