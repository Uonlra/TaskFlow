name: Windows desktop release draft

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Must match package.json, e.g. v2.2.0-beta.2"
        required: true
        default: "v2.2.0-beta.2"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-draft:
    runs-on: windows-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://www.uta4k.top
      NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ vars.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Validate release version, tag and public configuration
        id: release
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/prepare-desktop-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop-updater
      - run: pnpm test:desktop-tray
      - run: pnpm test:desktop-release
      - run: pnpm typecheck
      - name: Build Windows NSIS and channel update metadata
        run: pnpm desktop:dist
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - run: pnpm desktop:verify-release
      - uses: actions/upload-artifact@v6
        with:
          name: taskflow-windows-${{ steps.release.outputs.channel }}
          path: |
            dist/electron/TaskFlow-Setup-*-win-x64.exe
            dist/electron/TaskFlow-Setup-*-win-x64.exe.blockmap
            dist/electron/${{ steps.release.outputs.metadata }}
            dist/electron/SHA256SUMS.txt
            dist/electron/release-manifest.json
          if-no-files-found: error
      - name: Create or refresh draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_METADATA: ${{ steps.release.outputs.metadata }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $isPrerelease = $env:RELEASE_PRERELEASE -eq 'true'
          $existing = gh release view $tag --json isDraft,targetCommitish,isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (!$release.isDraft -or $release.targetCommitish -ne $env:GITHUB_SHA -or $release.isPrerelease -ne $isPrerelease) { throw 'Refusing to replace a public release, a draft from another commit, or a different release channel.' }
          } else {
            $releaseFlags = @('--draft')
            if ($isPrerelease) { $releaseFlags += '--prerelease' }
            gh release create $tag @releaseFlags --target $env:GITHUB_SHA --title "TaskFlow $version Windows $env:RELEASE_CHANNEL" --notes-file "docs/releases/$tag.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          $assets = @(Get-ChildItem dist/electron -File | Where-Object { $_.Name -in @("TaskFlow-Setup-$version-win-x64.exe", "TaskFlow-Setup-$version-win-x64.exe.blockmap", $env:RELEASE_METADATA, 'SHA256SUMS.txt', 'release-manifest.json') } | ForEach-Object FullName)
          if ($assets.Count -ne 5) { throw 'Incomplete release assets.' }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
