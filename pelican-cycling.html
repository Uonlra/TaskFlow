<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ed">
  <title>鹈鹕的海边骑行 · Pelican Cycling Club</title>
  <style>
    :root { color-scheme: light; --paper: #f7f5ed; --ink: #293d3a; --muted: #7a8580; --orange: #e77d4c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    .page { max-width: 1280px; margin: 0 auto; padding: 30px 48px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 2px; font-weight: 700; }
    .brand svg { width: 36px; height: 36px; }
    .edition { font: 10px/1.5 "Courier New", monospace; color: var(--muted); letter-spacing: 2px; }
    .intro { text-align: center; margin: 43px 0 26px; }
    .eyebrow { font-size: 10px; letter-spacing: 4px; color: #9a7153; margin: 0 0 13px; }
    h1 { margin: 0; font-size: clamp(29px, 4vw, 49px); letter-spacing: 3px; font-weight: 650; line-height: 1.5; }
    h1 span { color: var(--orange); }
    .subtitle { font-size: 12px; letter-spacing: 2px; color: var(--muted); margin: 12px 0 0; }
    .scene-wrap { position: relative; overflow: hidden; border-radius: 18px; background: #e9f0e8; }
    .scene-meta { position: absolute; left: 28px; top: 24px; z-index: 1; display: flex; gap: 9px; align-items: center; color: #5d7870; font-size: 10px; letter-spacing: 2px; pointer-events: none; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #719b77; }
    .weather { position: absolute; right: 28px; top: 24px; color: #6c8279; font-size: 11px; letter-spacing: 1px; }
    #scene { display: block; width: 100%; height: auto; }
    .controls { width: fit-content; max-width: 100%; display: flex; align-items: center; justify-content: center; gap: 24px; margin: 24px auto 0; padding: 10px 12px; background: #fffdf8; border: 1px solid #e5e5da; border-radius: 50px; }
    .play { display: flex; gap: 9px; align-items: center; justify-content: center; min-width: 110px; border: 0; background: var(--ink); color: #fffdf7; padding: 12px 19px; border-radius: 30px; font-size: 12px; }
    .play:hover { background: #41615b; }
    button svg { width: 16px; height: 16px; flex-shrink: 0; }
    .speed { display: flex; align-items: center; gap: 12px; font-size: 11px; color: #738078; }
    input[type="range"] { width: 100px; height: 4px; accent-color: #54776b; cursor: pointer; }
    output { width: 29px; color: var(--ink); font: 11px "Courier New", monospace; }
    .divider { width: 1px; height: 22px; background: #e5e5da; }
    .bell { border: 0; background: transparent; color: var(--ink); display: flex; align-items: center; gap: 8px; padding: 10px 17px 10px 0; font-size: 12px; border-radius: 20px; }
    .bell:hover { color: var(--orange); }
    .hint { text-align: center; color: #91978e; font-size: 10px; letter-spacing: 1px; margin: 15px 0 28px; }
    footer { border-top: 1px solid #e2e4d9; padding-top: 19px; display: flex; justify-content: space-between; gap: 15px; color: #859087; font-size: 10px; letter-spacing: 1px; }
    footer span:last-child { font-family: "Courier New", monospace; letter-spacing: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 640px) {
      .page { padding: 22px 18px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .brand { font-size: 9px; letter-spacing: 1px; gap: 6px; }
      .intro { margin: 40px 0 25px; }
      h1 { letter-spacing: 1px; }
      .subtitle { font-size: 10px; letter-spacing: 1px; }
      #scene { width: 155%; max-width: none; margin-left: -27.5%; }
      .scene-meta { top: 16px; left: 16px; font-size: 8px; letter-spacing: 1px; }
      .weather { top: 16px; right: 16px; font-size: 9px; }
      .controls { gap: 12px; padding: 8px; margin-top: 22px; }
      .play { min-width: 86px; padding: 11px 12px; font-size: 11px; }
      .speed { gap: 7px; }
      .speed label { display: none; }
      input[type="range"] { width: 65px; }
      .bell { padding-right: 5px; gap: 5px; font-size: 11px; }
      footer { font-size: 9px; letter-spacing: 0; }
      footer span:last-child { letter-spacing: 0; }
    }
    @media (max-width: 360px) { .controls { gap: 8px; } .bell span { display: none; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">

          <path d="m786 179 13 1q12 3-1 8l-12 1" fill="#dc9560"/>

          <path d="M574 143q47-9 88-3" fill="none" stroke="#935f43" stroke-width="7" stroke-linecap="round"/>
          <path d="m587 147 17 38 18-31" fill="none" stroke="#a57f5a" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- A scarf in the sea breeze. -->

    <div class="controls" role="group" aria-label="动画控制">
      <button class="play" id="play" type="button" aria-label="暂停动画" aria-pressed="false"><svg id="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 4h3v12H5zm7 0h3v12h-3z"/></svg><span id="play-label">歇一会儿</span></button>
      <div class="speed"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" value="1" step="0.25" aria-label="骑行速度"><output id="speed-value" for="speed">1.0×</output></div>

    </div>
    <p class="hint">按空格暂停 · 让好心情多骑一会儿</p>
    <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
    <footer><span>生活偶尔慢半拍，也很好。</span><span>HAND-DRAWN VIBES. HAPPY LITTLE RIDES.</span></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches;
      let speed = 1, time = 0, previous = null, frame = null, audioContext = null, bellTimer;
      const elements = Object.fromEntries(['rear-spokes', 'front-spokes', 'crank', 'near-leg', 'far-leg', 'near-foot', 'far-foot', 'near-pedal', 'far-pedal', 'rider', 'cloud-layer', 'plant-layer', 'road-pattern', 'wave-pattern', 'sailboat', 'gulls', 'scarf-tail', 'eye', 'wind-one', 'wind-two'].map(id => [id, $(id)]));
      const set = (id, attribute, value) => elements[id].setAttribute(attribute, value);

      // A two-segment leg keeps its length while its foot follows the crank.
      function leg(side, angle, hipX, hipY) {
        const x = 545 + Math.cos(angle) * 30;
        const y = 490 + Math.sin(angle) * 30;
        const dx = x - hipX, dy = y - hipY;
        const distance = Math.hypot(dx, dy);
        const upper = 94, lower = 94;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + height * dy / distance;
        const kneeY = hipY + along * dy / distance - height * dx / distance;
        set(side + '-leg', 'd', `M${hipX} ${hipY} L${kneeX} ${kneeY} L${x} ${y - 5}`);
        set(side + '-foot', 'd', `M${x - 8} ${y - 5} Q${x + 5} ${y - 1} ${x + 19} ${y - 3}`);
        set(side + '-pedal', 'd', `M${x - 10} ${y + 3}h30`);
      }

      function draw() {
        const phase = time * 3.2;
        const degrees = phase * 180 / Math.PI;
        const travel = time * 126;
        set('rear-spokes', 'transform', `rotate(${travel / 77 * 180 / Math.PI})`);
        set('front-spokes', 'transform', `rotate(${travel / 77 * 180 / Math.PI})`);
        set('crank', 'transform', `rotate(${degrees} 545 490)`);
        leg('far', phase + Math.PI, 502, 362);
        leg('near', phase, 511, 363);
        set('rider', 'transform', `translate(0 ${Math.sin(phase * 2) * 1.25})`);
        set('cloud-layer', 'transform', `translate(${-time * 8 % 1100} 0)`);
        set('plant-layer', 'transform', `translate(${-travel % 1100} 0)`);
        set('road-pattern', 'patternTransform', `translate(${-travel % 170} 0)`);
        set('wave-pattern', 'patternTransform', `translate(${-time * 22 % 260} 0)`);
        set('sailboat', 'transform', `translate(${1130 - (time * 3 + 910) % 1160} ${365 + Math.sin(time * 1.2) * 1.4})`);
        set('gulls', 'transform', `translate(0 ${Math.sin(time * .7) * 4})`);
        const flutter = Math.sin(time * 7) * 6;
        set('scarf-tail', 'd', `M578 223Q538 ${205 + flutter} 501 ${219 + flutter}l-21-12 6 24q42-13 87 ${7 - flutter}Z`);
        const blink = time % 5.3 > 5.14 ? .12 : 1;
        set('eye', 'transform', `translate(0 ${160 * (1 - blink)}) scale(1 ${blink})`);
        set('wind-one', 'opacity', .6 + Math.sin(time * 3) * .3);
        set('wind-two', 'opacity', .6 + Math.cos(time * 3) * .3);
      }

      function tick(timestamp) {
        if (!playing || document.hidden) { frame = null; previous = null; return; }
        if (previous !== null) time += Math.min((timestamp - previous) / 1000, .05) * speed;
        previous = timestamp;
        draw();
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        $('play').setAttribute('aria-pressed', String(!playing));
        $('play').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        $('play-label').textContent = playing ? '歇一会儿' : '继续出发';
        $('play-icon').innerHTML = playing ? '<path d="M5 4h3v12H5zm7 0h3v12h-3z"/>' : '<path d="m6 3 11 7-11 7Z"/>';
        $('ride-status').textContent = playing ? '海岸漫游中' : '在海边歇一会儿';
        $('live-dot').style.background = playing ? '#719b77' : '#bfaa83';
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previous = null;
        if (playing && !document.hidden) frame = requestAnimationFrame(tick);
      }

      $('play').addEventListener('click', () => { playing = !playing; syncPlayback(); });
      $('speed').addEventListener('input', (event) => {
        speed = Number(event.target.value);
        $('speed-value').textContent = (Number.isInteger(speed * 10) ? speed.toFixed(1) : speed.toFixed(2)) + '×';
        event.target.setAttribute('aria-valuetext', speed + ' 倍速');
      });
      document.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' || event.repeat || event.target.closest('button, input, textarea, select, a, [contenteditable]')) return;
        event.preventDefault();
        playing = !playing;
        syncPlayback();
      });
      document.addEventListener('visibilitychange', syncPlayback);
      motionPreference.addEventListener('change', (event) => {
        if (event.matches) { playing = false; syncPlayback(); }
      });
      $('bell').addEventListener('click', async () => {
        $('bell-bubble').setAttribute('opacity', '1');
        $('announcement').textContent = '叮铃！鹈鹕向你打了个招呼。';
        clearTimeout(bellTimer);
        bellTimer = setTimeout(() => { $('bell-bubble').setAttribute('opacity', '0'); $('announcement').textContent = ''; }, 1200);
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          audioContext ||= new Audio();
          if (audioContext.state === 'suspended') await audioContext.resume();
          const start = audioContext.currentTime;
          [0, .15].forEach((delay, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = index ? 1760 : 2093;
            gain.gain.setValueAtTime(0, start + delay);
            gain.gain.linearRampToValueAtTime(.13, start + delay + .008);
            gain.gain.exponentialRampToValueAtTime(.001, start + delay + .8);
            oscillator.connect(gain); gain.connect(audioContext.destination);
            oscillator.start(start + delay); oscillator.stop(start + delay + .85);
            oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
          });
        } catch { /* The visual bell remains available if audio is unsupported. */ }
      });
      draw();
      syncPlayback();
    })();
  </script>
</body>
</html>
