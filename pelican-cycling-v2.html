<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ec">
  <meta name="description" content="一只鹈鹕、一辆小自行车和一段不赶时间的海边旅程。可离线播放的原创 SVG 2D 动画。">
  <title>快乐在路上 · 鹈鹕骑行记</title>
  <style>
    :root { color-scheme: light; --paper: #f8f5ec; --ink: #254b48; --orange: #e9814b; --muted: #7e8b7e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    .page { width: min(1280px, 100%); margin: auto; padding: 27px 48px 22px; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand svg { width: 43px; height: 43px; }
    .brand-name { font-size: 12px; line-height: 1.35; letter-spacing: 2.5px; font-weight: 800; }
    .brand-name small { display: block; font-size: 8px; font-weight: 500; letter-spacing: 2px; padding-top: 3px; }
    .edition { font: 10px/1.5 "Courier New", monospace; letter-spacing: 1.5px; color: var(--muted); }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: 37px 0 30px; }
    .eyebrow { margin: 0 0 10px; color: #a27c53; font: 10px/1.5 "Courier New", monospace; letter-spacing: 3px; }
    h1 { font-size: clamp(30px, 4vw, 51px); line-height: 1.25; letter-spacing: 1px; margin: 0; font-weight: 750; }
    h1 em { font-style: normal; color: var(--orange); }
    .intro-copy { font-size: 12px; line-height: 1.9; letter-spacing: 1px; color: #809083; margin: 0 4px 3px 0; }
    .postcard { position: relative; border: 1px solid #e3dcc7; padding: 9px; background: #fffcf3; border-radius: 7px; box-shadow: 0 6px 0 -3px #eee8d7; }
    .scene { --sky: #f5e7ad; --sea: #8ebfc0; --wave: #c4ddcc; --island: #74a8a0; --sand: #e6d59a; --dune: #c1c28c; --road: #e9dec0; --roadline: #fff7df; --sun: #efad60; --star-opacity: 0; --cloud: #fff7d9; position: relative; border-radius: 3px; overflow: hidden; background: var(--sky); }
    .scene[data-light="sunset"] { --sky: #e7b39f; --sea: #809f9f; --wave: #bfc9b8; --island: #79958d; --sand: #d8bd90; --dune: #b6ae83; --road: #dbc5a6; --roadline: #f6e2bf; --sun: #f5d7a0; --star-opacity: .75; --cloud: #f2cfb7; }
    #landscape { display: block; width: 100%; height: auto; }
    .scene-label { position: absolute; z-index: 1; top: 24px; left: 27px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
    .number { font: 12px "Courier New", monospace; border: 1px solid #6e876a; padding: 6px; border-radius: 50%; }
    .scene-label p { margin: 0; font-size: 10px; letter-spacing: 2px; }
    .scene-label small { display: block; margin-top: 5px; color: #648075; font: 8px "Courier New", monospace; letter-spacing: 1px; }
    .light-switch { position: absolute; right: 22px; top: 22px; z-index: 1; display: flex; padding: 3px; gap: 2px; background: #fffae855; border: 1px solid #59766740; border-radius: 24px; }
    .light-switch button { border: 0; padding: 6px 11px; border-radius: 20px; background: transparent; color: #536f62; font-size: 10px; letter-spacing: 1px; }
    .light-switch button[aria-pressed="true"] { background: #fff8e5; color: #254b48; box-shadow: 0 1px 3px #54695112; }
    .postcard-caption { display: flex; justify-content: space-between; align-items: center; padding: 12px 13px 4px; gap: 15px; }
    .caption-title { font-size: 10px; letter-spacing: 1px; }
    .coordinates { color: #9a9c89; font: 9px "Courier New", monospace; letter-spacing: 1px; }
    .control-deck { display: flex; align-items: center; gap: 20px; padding: 25px 6px 20px; }
    .play { display: flex; align-items: center; gap: 9px; border: 0; border-radius: 28px; background: var(--ink); color: #fff9e9; padding: 13px 19px; font-size: 12px; min-width: 116px; justify-content: center; }
    .play:hover { background: #39645b; }
    .play svg { width: 14px; height: 14px; }
    .speed-control { display: flex; gap: 12px; align-items: center; }
    .speed-control label { font-size: 11px; color: var(--muted); }
    input[type="range"] { accent-color: #5f8271; width: 110px; height: 4px; cursor: pointer; }
    .speed-control output { min-width: 33px; font: 11px "Courier New", monospace; }
    .separator { height: 23px; width: 1px; background: #d9dfcf; }
    .bell { display: flex; align-items: center; gap: 8px; border: 0; padding: 9px 0; background: transparent; color: var(--ink); font-size: 12px; }
    .bell:hover { color: var(--orange); }
    .bell svg { width: 18px; height: 18px; }
    .ride-data { margin-left: auto; display: flex; align-items: center; gap: 22px; }
    .data-item { display: flex; align-items: baseline; gap: 6px; }
    .data-item strong { font: 18px "Courier New", monospace; letter-spacing: -.5px; }
    .data-item span { font-size: 9px; color: var(--muted); }
    footer { border-top: 1px solid #dfe3d4; padding-top: 15px; display: flex; align-items: center; justify-content: space-between; gap: 16px; color: #8b9587; font-size: 10px; letter-spacing: .5px; }
    footer .motto { color: #6d8273; }
    kbd { font: inherit; padding: 2px 6px; border: 1px solid #d7ddcf; border-radius: 3px; margin: 0 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
    #bell-message { opacity: 0; }
    #bell-message.visible { opacity: 1; }
    @media (max-width: 760px) {
      .page { padding: 22px 20px; }
      .intro { padding: 30px 0 24px; }
      .intro-copy { font-size: 10px; }
      .control-deck { gap: 14px; flex-wrap: wrap; }
      .ride-data { gap: 15px; }
      .speed-control { gap: 9px; }
      input[type="range"] { width: 85px; }
    }
    @media (max-width: 560px) {
      .page { padding: 19px 16px; }
      .brand-name { font-size: 10px; letter-spacing: 1.5px; }
      .brand-name small { font-size: 7px; letter-spacing: 1px; }
      .brand svg { width: 35px; height: 35px; }
      .edition { font-size: 8px; letter-spacing: .4px; }
      .intro { display: block; padding: 33px 2px 22px; }
      .eyebrow { font-size: 8px; letter-spacing: 2px; }
      h1 { font-size: clamp(28px, 7.4vw, 40px); letter-spacing: .1px; }
      .intro-copy { margin: 13px 0 0; font-size: 10px; line-height: 1.7; }
      .intro-copy br { display: none; }
      .postcard { padding: 6px; }
      #landscape { width: 175%; max-width: none; margin-left: -37.5%; }
      .scene-label { top: 15px; left: 14px; gap: 7px; }
      .scene-label p { font-size: 8px; letter-spacing: 1px; }
      .scene-label small { display: none; }
      .number { font-size: 9px; padding: 5px; }
      .light-switch { top: 13px; right: 12px; }
      .light-switch button { font-size: 8px; padding: 5px 8px; }
      .postcard-caption { padding: 11px 6px 5px; }
      .caption-title { font-size: 9px; }
      .coordinates { font-size: 7px; letter-spacing: 0; }
      .control-deck { padding: 21px 0 18px; gap: 14px; }
      .play { min-width: 103px; padding: 12px 15px; font-size: 11px; }
      .speed-control label { display: none; }
      .speed-control { gap: 7px; }
      input[type="range"] { width: 72px; }
      .speed-control output { min-width: 29px; font-size: 10px; }
      .separator { display: none; }
      .bell { font-size: 11px; gap: 5px; margin-left: auto; }
      .ride-data { width: 100%; margin-left: 2px; gap: 25px; }
      .data-item strong { font-size: 15px; }
      .data-item span { font-size: 8px; }
      footer { font-size: 8px; gap: 8px; }
      footer .motto { letter-spacing: 0; }
    }
    @media (max-width: 350px) { .control-deck { gap: 10px; } .bell span { display: none; } }
    @media (prefers-reduced-motion: no-preference) { .light-switch button, .play, .bell { transition: background .2s, color .2s; } }
  </style>
</head>

            <ellipse cx="629" cy="205" rx="10" ry="6" fill="#e5aa7c" opacity=".45"/>
            <!-- A vented helmet and its chin strap. -->
            <path d="m603 175 17 42 24-40" fill="none" stroke="#849375" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M589 169c-3-31 12-53 40-53 28-1 45 22 43 52Z" fill="#6c9b82" stroke="#365b48" stroke-width="3"/>
            <path d="M600 152c1-13 7-23 15-28m5 29c0-13 2-23 5-29m16 30c-1-13-4-23-8-29" fill="none" stroke="#d8ddb1" stroke-width="5" stroke-linecap="round"/>
            <path d="M586 171q45-13 91 2" fill="none" stroke="#365b48" stroke-width="7" stroke-linecap="round"/>
            <path d="M588 170q44-10 87 3" fill="none" stroke="#89ac86" stroke-width="3" stroke-linecap="round"/>
            <!-- The scarf is deformed by the same animation clock as the pedaling. -->
            <path id="scarf-tail" d="M581 265q-46-29-77-12l-20-11 7 26q43-14 87 13Z" fill="#e28a51" stroke="#ae6d43" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M576 259q23 12 42 4l1 17q-24 7-43-7Z" fill="#e8975b" stroke="#ae6d43" stroke-width="2.5"/>
            <path d="m585 265-2 10m13-6-1 9m11-10 1 9" stroke="#f8d492" stroke-width="2.5"/>
            <!-- The long folded wing reaches the right handlebar. -->
            <path d="M429 328c22-21 57-8 85 8 46 24 100 28 167 14 14-3 20 7 7 14-53 31-119 21-163 10-43 7-84-10-96-31-3-5-4-9 0-15Z" fill="#f4f1d8" stroke="#385a4a" stroke-width="3" stroke-linejoin="round"/>
            <path d="M448 337c32 24 83 34 126 34m-117-23c27 16 64 24 91 26" fill="none" stroke="#ccd5b8" stroke-width="3" stroke-linecap="round"/>
          </g>
          <g id="front-leg-group" stroke-linecap="round" stroke-linejoin="round">
            <path id="front-leg" d="M515 393 580 434 582 506" fill="none" stroke="#dda55b" stroke-width="12"/>
            <path id="front-foot" d="M574 501h31" fill="none" stroke="#e6ad61" stroke-width="12"/>
            <path id="front-pedal" d="M572 510h32" stroke="#254b48" stroke-width="5"/>
            <path id="leg-feathers" d="M500 386q13 7 28 1l-5 13q-14 2-22-4Z" fill="#fff9e6" stroke="none"/>
          </g>
          <g transform="translate(704 339)"><path d="M-8 1a8 8 0 0 1 16 0Z" fill="#e9b45e" stroke="#6b7650" stroke-width="2"/><path d="M0-10v2" stroke="#6b7650" stroke-width="2" stroke-linecap="round"/></g>
          <g id="bell-message" transform="translate(744 291)"><path d="M-8-25h69a14 14 0 0 1 14 14v5A14 14 0 0 1 61 8H7l-14 9 3-10A14 14 0 0 1-22-6v-5A14 14 0 0 1-8-25Z" fill="#fffae5"/><text x="27" y="-3" text-anchor="middle" fill="#aa7846" font-size="14" font-family="sans-serif">叮铃 ♪</text><path d="m-35 15-9 4m8-18-10-2" fill="none" stroke="#bd8a4e" stroke-width="2" stroke-linecap="round"/></g>
          <g id="wind" fill="none" stroke="#658b75" stroke-width="2.5" stroke-linecap="round"><path d="M313 312h-40m14 17h-47M335 403h-28"/></g>
          <g transform="translate(1038 581) rotate(-7)" fill="#6f8b73" opacity=".6"><text text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic">enjoy the ride</text><path d="M-54 9q58 10 109-1" fill="none" stroke="#6f8b73" stroke-width="1.5"/></g>
          <path d="M0 0h1200v660H0Z" filter="url(#paper-grain)" opacity=".12" pointer-events="none"/>
        </svg>
      </div>
      <div class="postcard-caption"><span class="caption-title" id="caption">此刻，正在路上。</span><span class="coordinates">NO DEADLINES. JUST COASTLINES.</span></div>
    </section>
    <div class="control-deck" role="group" aria-label="骑行动画控制">
      <button type="button" class="play" id="play" aria-label="暂停动画" aria-pressed="false"><svg id="play-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zm5 0h3v10H9Z"/></svg><span id="play-label">暂停一下</span></button>
      <div class="speed-control"><label for="speed">骑行节奏</label><input type="range" id="speed" min="0.5" max="2" value="1" step="0.25" aria-label="骑行速度" aria-valuetext="1 倍速"><output for="speed" id="speed-output">1.0×</output></div>
      <span class="separator" aria-hidden="true"></span>
      <button class="bell" id="bell" type="button" aria-label="按响自行车铃"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h12l-2-3V7a4 4 0 0 0-8 0v3Zm4 3q2 2 4 0M10 2v1"/></svg><span>打个招呼</span></button>
      <div class="ride-data" aria-label="模拟骑行数据"><div class="data-item"><strong id="distance">000</strong><span>m · 快乐里程</span></div><div class="data-item"><strong id="velocity">12.0</strong><span>km/h</span></div></div>
    </div>
    <footer><span class="motto">骑慢一点，好风景会等你。</span><span><kbd>Space</kbd> 暂停 / 继续</span></footer>
    <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const ids = ['clouds', 'distance-layer', 'shore-layer', 'water-lines', 'road-lines', 'sailboat', 'back-wheel', 'front-wheel', 'crank', 'back-leg', 'back-foot', 'back-pedal', 'front-leg', 'front-foot', 'front-pedal', 'pelican', 'leg-feathers', 'scarf-tail', 'eye', 'flower', 'flower-stem', 'gull-one', 'gull-two', 'gull-one-wings', 'gull-two-wings', 'wind'];
      const nodes = Object.fromEntries(ids.map(id => [id, byId(id)]));
      const set = (id, key, value) => nodes[id].setAttribute(key, value);
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      let running = !motion.matches;
      let rate = 1, seconds = 0, kilometers = 0, previous = null, request = null, lastMeter = -1;
      let bellTimeout, sound;

      // Two rigid segments meet at a knee that always bends toward the handlebars.
      function drawLeg(side, angle, hipX, hipY) {
        const footX = 550 + Math.cos(angle) * 32;
        const footY = 506 + Math.sin(angle) * 32;
        const ankleY = footY - 5;
        const dx = footX - hipX, dy = ankleY - hipY;
        const length = Math.hypot(dx, dy);
        const upper = 91, lower = 91;
        const along = (upper * upper - lower * lower + length * length) / (2 * length);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + dx / length * along + dy / length * height;
        const kneeY = hipY + dy / length * along - dx / length * height;
        set(side + '-leg', 'd', `M${hipX} ${hipY}L${kneeX} ${kneeY} ${footX} ${ankleY}`);
        set(side + '-foot', 'd', `M${footX - 6} ${ankleY}Q${footX + 9} ${footY} ${footX + 23} ${footY - 2}`);
        set(side + '-pedal', 'd', `M${footX - 9} ${footY + 5}h34`);
      }

      function render() {
        const angle = seconds * 2.65;
        const degrees = angle * 180 / Math.PI;
        // Ground travel equals wheel rotation × wheel radius, avoiding sliding tires.
        const travel = angle * 83 * .78;
        const bob = Math.sin(angle * 2) * 1.6;
        set('back-wheel', 'transform', `rotate(${travel / 83 * 180 / Math.PI})`);
        set('front-wheel', 'transform', `rotate(${travel / 83 * 180 / Math.PI})`);
        set('crank', 'transform', `rotate(${degrees} 550 506)`);
        drawLeg('back', angle + Math.PI, 504, 390 + bob);
        drawLeg('front', angle, 515, 393 + bob);
        set('pelican', 'transform', `translate(0 ${bob})`);
        set('leg-feathers', 'transform', `translate(0 ${bob})`);
        set('clouds', 'transform', `translate(${-seconds * 8 % 1200} 0)`);
        set('distance-layer', 'transform', `translate(${-seconds * 13 % 1200} 0)`);
        set('shore-layer', 'transform', `translate(${-travel % 1200} 0)`);
        set('road-lines', 'patternTransform', `translate(${-travel % 180} 0)`);
        set('water-lines', 'patternTransform', `translate(${-seconds * 24 % 290} 0)`);
        set('sailboat', 'transform', `translate(${1240 - (seconds * 4 + 1080) % 1280} ${374 + Math.sin(seconds * 1.3) * 1.4})`);
        const flutter = Math.sin(seconds * 8) * 5;
        set('scarf-tail', 'd', `M581 265q-46 ${-29 + flutter}-77 ${-12 + flutter}l-20-11 7 26q43-14 87 ${13 - flutter}Z`);
        const blink = seconds % 5.2 > 5.04 ? .1 : 1;
        set('eye', 'transform', `translate(0 ${184 * (1 - blink)}) scale(1 ${blink})`);
        const sway = Math.sin(seconds * 4) * 3;
        set('flower', 'transform', `translate(${796 + sway} 328) rotate(${sway * 2})`);
        set('flower-stem', 'd', `M796 382q15-24 ${sway}-49`);
        const flap = Math.sin(seconds * 3) * 5;
        set('gull-one-wings', 'd', `M-17 ${flap - 4}Q-8 ${flap - 11} 0 0 8 ${flap - 11} 17 ${flap - 4}`);
        set('gull-two-wings', 'd', `M-13 ${-flap - 3}Q-6 ${-flap - 9} 0 0 6 ${-flap - 9} 13 ${-flap - 3}`);
        set('gull-one', 'transform', `translate(${384 + Math.sin(seconds * .25) * 18} ${151 + Math.sin(seconds) * 4})`);
        set('gull-two', 'transform', `translate(${903 + Math.cos(seconds * .2) * 14} ${220 + Math.cos(seconds * .8) * 3})`);
        set('wind', 'opacity', .4 + Math.sin(seconds * 3) * .15);
        const meters = Math.floor(kilometers * 1000);
        if (meters !== lastMeter) {
          byId('distance').textContent = String(meters).padStart(3, '0');
          lastMeter = meters;
        }
      }

      function tick(now) {
        request = null;
        if (!running || document.hidden) { previous = null; return; }
        if (previous !== null) {
          const delta = Math.min((now - previous) / 1000, .05);
          seconds += delta * rate;
          kilometers += 12 * rate * delta / 3600;
        }
        previous = now;
        render();
        request = requestAnimationFrame(tick);
      }

      function updatePlayback() {
        const button = byId('play');
        button.setAttribute('aria-label', running ? '暂停动画' : '播放动画');
        button.setAttribute('aria-pressed', String(!running));
        byId('play-label').textContent = running ? '暂停一下' : '继续出发';
        byId('play-icon').innerHTML = running ? '<path d="M4 3h3v10H4zm5 0h3v10H9Z"/>' : '<path d="m4 2 10 6-10 6Z"/>';
        byId('caption').textContent = running ? '此刻，正在路上。' : '歇一会儿，听听海风。';
        byId('velocity').textContent = running ? (12 * rate).toFixed(1) : '0.0';
        if (request !== null) cancelAnimationFrame(request);
        request = null;
        previous = null;
        if (running && !document.hidden) request = requestAnimationFrame(tick);
      }

      const toggle = () => { running = !running; updatePlayback(); };
      byId('play').addEventListener('click', toggle);
      byId('speed').addEventListener('input', event => {
        rate = Number(event.target.value);
        byId('speed-output').textContent = rate.toFixed(Number.isInteger(rate * 10) ? 1 : 2) + '×';
        event.target.setAttribute('aria-valuetext', rate + ' 倍速');
        byId('velocity').textContent = running ? (12 * rate).toFixed(1) : '0.0';
      });
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.target.closest('button, input, textarea, select, a, [contenteditable]')) return;
        event.preventDefault();
        toggle();
      });
      document.addEventListener('visibilitychange', updatePlayback);
      motion.addEventListener('change', event => { if (event.matches) { running = false; updatePlayback(); } });

      document.querySelectorAll('[data-light][type="button"]').forEach(button => {
        button.addEventListener('click', () => {
          byId('scene').dataset.light = button.dataset.light;
          document.querySelectorAll('[data-light][type="button"]').forEach(option => option.setAttribute('aria-pressed', String(option === button)));
        });
      });

      byId('bell').addEventListener('click', async () => {
        byId('bell-message').classList.add('visible');
        byId('announcement').textContent = '叮铃！祝你今天也有好心情。';
        clearTimeout(bellTimeout);
        bellTimeout = setTimeout(() => { byId('bell-message').classList.remove('visible'); byId('announcement').textContent = ''; }, 1300);
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          sound ||= new Audio();
          if (sound.state === 'suspended') await sound.resume();
          const start = sound.currentTime;
          [0, .16].forEach((delay, index) => {
            const oscillator = sound.createOscillator();
            const gain = sound.createGain();
            oscillator.frequency.value = index ? 1760 : 2349;
            gain.gain.setValueAtTime(0, start + delay);
            gain.gain.linearRampToValueAtTime(.1, start + delay + .006);
            gain.gain.exponentialRampToValueAtTime(.001, start + delay + .8);
            oscillator.connect(gain); gain.connect(sound.destination);
            oscillator.start(start + delay); oscillator.stop(start + delay + .82);
            oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
          });
        } catch { /* A visual greeting also works when browser audio is unavailable. */ }
      });
      render();
      updatePlayback();
    })();
  </script>
</body>
</html>
