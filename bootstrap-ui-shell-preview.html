<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U's Task App Shell Preview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root{--bg:#f7f8fa;--surface:#fff;--border:#e5e7eb;--soft:#eef0f3;--text:#171a20;--muted:#6b7280;--primary:#3e6ae1;--primary-soft:#f1f5ff;--sidebar:248px}
    *{box-sizing:border-box} body{min-width:320px;margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}
    .app-sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);padding:28px 18px 20px;background:#fff;border-right:1px solid var(--border);z-index:20}
    .brand{color:var(--primary);font-size:13px;font-weight:700}.workspace-title{margin:18px 10px 0;font-size:23px;font-weight:650}.workspace-description{margin:8px 10px 0;color:var(--muted);font-size:13px;line-height:1.55}
    .app-nav{display:grid;gap:6px;margin-top:34px}.app-nav a{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 12px;color:var(--text);border-radius:6px;text-decoration:none}.app-nav a:hover,.app-nav a.active{color:var(--primary);background:#f5f6f8}.app-nav a.active:before{position:absolute;inset:8px auto 8px 0;width:3px;content:"";background:var(--primary);border-radius:2px}.nav-icon{width:30px;color:currentColor;font-size:18px;text-align:center}.nav-copy{display:grid;gap:1px}.nav-copy strong{font-size:14px;font-weight:650}.nav-copy small{color:var(--muted);font-size:12px}
    .sidebar-note{position:absolute;right:18px;bottom:20px;left:18px;padding:14px;border:1px solid var(--border);border-radius:8px;background:#fff}.sidebar-note small{color:var(--primary);font-weight:650}.sidebar-note strong,.sidebar-note span{display:block}.sidebar-note strong{margin-top:8px;font-size:13px}.sidebar-note span{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}
    .app-main{min-height:100vh;margin-left:var(--sidebar)}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:72px;padding:0 36px}.topbar-status{display:grid;gap:2px}.topbar-status strong{color:var(--primary);font-size:13px}.topbar-status span{color:var(--muted);font-size:12px}.avatar{width:34px;height:34px;color:var(--primary);background:var(--primary-soft);border:1px solid #dce6ff;border-radius:50%}
    .mobile-header,.mobile-bottom-nav{display:none}.page-wrap{max-width:1440px;margin:0 auto;padding:0 36px 48px}.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.page-header h1{margin:0;font-size:30px;font-weight:650;letter-spacing:-.03em}.page-header p{margin:7px 0 0;color:var(--muted);font-size:13px}
    .btn-primary{--bs-btn-bg:var(--primary);--bs-btn-border-color:var(--primary);--bs-btn-hover-bg:#3457bd;--bs-btn-hover-border-color:#3457bd;border-radius:6px}.surface{background:var(--surface);border:1px solid var(--border);border-radius:8px}.metric{min-height:112px;padding:18px}.metric span,.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:10px;font-size:27px;font-weight:650}.metric.accent{background:var(--primary-soft);border-color:#dce6ff}
    .task-surface{min-height:440px}.surface-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 20px;border-bottom:1px solid var(--soft)}.surface-header h2{margin:0;font-size:16px;font-weight:650}.surface-header span{color:var(--muted);font-size:12px}.empty-state{display:grid;place-items:center;min-height:330px;padding:32px 20px;text-align:center}.empty-icon{display:grid;place-items:center;width:40px;height:40px;margin:auto;color:var(--primary);background:var(--primary-soft);border:1px solid #dce6ff;border-radius:8px;font-size:18px}.empty-state h3{margin:14px 0 0;font-size:16px;font-weight:650}.empty-state p{max-width:300px;margin:6px 0 16px;color:var(--muted);font-size:13px}
    @media (max-width:991.98px){
      .app-sidebar,.topbar{display:none}.app-main{margin-left:0;padding-bottom:84px}.mobile-header{display:flex;align-items:center;justify-content:space-between;min-height:68px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border)}.mobile-header strong{display:block;color:var(--primary);font-size:13px}.mobile-header span{display:block;margin-top:3px;font-size:17px;font-weight:650}.page-wrap{padding:24px 16px 32px}.page-header{align-items:stretch;flex-direction:column;gap:14px}.page-header h1{font-size:26px}.page-header .btn{align-self:flex-start}.metric{min-height:92px;padding:15px}.metric strong{margin-top:6px;font-size:23px}.task-surface{min-height:360px}.empty-state{min-height:250px}.mobile-bottom-nav{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:8px;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.08);backdrop-filter:blur(12px)}.mobile-bottom-nav a{display:grid;justify-items:center;gap:3px;padding:7px 2px;color:var(--muted);border-radius:7px;text-decoration:none;font-size:10px}.mobile-bottom-nav a i{font-size:17px;line-height:1}.mobile-bottom-nav a.active{color:var(--primary);background:var(--primary-soft)}}
    @media (max-width:575.98px){.page-wrap{padding-inline:14px}.metric strong{font-size:21px}.mobile-bottom-nav{right:8px;bottom:calc(8px + env(safe-area-inset-bottom));left:8px}}
  </style>
</head>
<body>
  <div class="app-preview">
    <aside class="app-sidebar" aria-label="桌面端主导航">
      <div class="brand">U&apos;s Task</div><h2 class="workspace-title">我的任务本</h2><p class="workspace-description">把要做的事放在一个简单、顺手的地方。</p>
      <nav class="app-nav">
        <a href="#"><i class="bi bi-circle nav-icon"></i><span class="nav-copy"><strong>总览</strong><small>今天先看这里</small></span></a>
        <a class="active" href="#"><i class="bi bi-list-check nav-icon"></i><span class="nav-copy"><strong>任务</strong><small>记录与整理</small></span></a>
        <a href="#"><i class="bi bi-calendar3 nav-icon"></i><span class="nav-copy"><strong>日历</strong><small>日期与截止</small></span></a>
        <a href="#"><i class="bi bi-bar-chart nav-icon"></i><span class="nav-copy"><strong>统计</strong><small>趋势与风险</small></span></a>
        <a href="#"><i class="bi bi-sliders nav-icon"></i><span class="nav-copy"><strong>设置</strong><small>个人信息</small></span></a>
      </nav>
      <div class="sidebar-note"><small>给自己的提醒</small><strong>先收住正在做的事。</strong><span>少开几个分支，手上的事会更容易做完。</span></div>
    </aside>
    <main class="app-main">
      <header class="topbar"><div class="topbar-status"><strong>访客浏览</strong><span>登录后即可管理和同步你的真实任务。</span></div><button class="avatar" type="button" aria-label="账号">访</button></header>
      <header class="mobile-header"><div><strong>U&apos;s Task</strong><span>任务</span></div><button class="avatar" type="button" aria-label="账号">访</button></header>
      <div class="page-wrap">
        <header class="page-header"><div><h1>任务</h1><p>集中查看、筛选和推进当前任务。</p></div><button class="btn btn-primary px-3" type="button"><i class="bi bi-plus-lg me-1"></i>新建任务</button></header>
        <section class="row g-3 mb-3" aria-label="任务指标">
          <div class="col-6 col-xl-3"><article class="surface metric"><span>全部任务</span><strong>0</strong><small>当前范围</small></article></div>
          <div class="col-6 col-xl-3"><article class="surface metric accent"><span>待处理</span><strong>0</strong><small>需要推进</small></article></div>
          <div class="col-6 col-xl-3"><article class="surface metric"><span>即将到期</span><strong>0</strong><small>未来 7 天</small></article></div>
          <div class="col-6 col-xl-3"><article class="surface metric"><span>逾期风险</span><strong>0</strong><small>需要关注</small></article></div>
        </section>
        <section class="surface task-surface"><div class="surface-header"><div><h2>任务列表</h2><span>统一列表卡片和空状态</span></div><button class="btn btn-sm btn-light border" type="button">重置筛选</button></div><div class="empty-state"><div><div class="empty-icon"><i class="bi bi-check2"></i></div><h3>还没有任务</h3><p>创建第一条任务后，它会出现在这里。</p><button class="btn btn-primary btn-sm px-3" type="button">新建任务</button></div></div></section>
      </div>
    </main>
    <nav class="mobile-bottom-nav" aria-label="移动端主导航"><a href="#"><i class="bi bi-circle"></i><span>总览</span></a><a class="active" href="#"><i class="bi bi-list-check"></i><span>任务</span></a><a href="#"><i class="bi bi-calendar3"></i><span>日历</span></a><a href="#"><i class="bi bi-bar-chart"></i><span>统计</span></a><a href="#"><i class="bi bi-sliders"></i><span>设置</span></a></nav>
  </div>
</body>
</html>
